# Ruff 配置（L1 静态缺陷检查）
# 命令：ruff check --no-fix <源码目录或文件列表>
target-version = "py313"
line-length = 110

extend-exclude = ["uploads", "ensemble", "ensemble_mean"]

[lint]
select = [
    "E4", "E7", "E9", # pycodestyle 子集（ruff 默认）
    "F",              # pyflakes
    "I",              # isort 导入排序
    "B",              # flake8-bugbear 常见缺陷
    "UP",             # pyupgrade 现代语法
]

[lint.per-file-ignores]
# demo_src 为演示参考代码，不按本仓库正式规范整改：
# EXE001 脚本 shebang 模式 / I001 既有导入顺序 / PLW1510 手工校验返回码
"demo_src/*" = ["EXE001", "I001", "PLW1510"]
