<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WNC 台风轨迹工作台</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/vendor/uPlot.min.css">
<!-- M8-R1：?v= 使浏览器内启发式缓存的旧 CSS 立即失效（配合 /static no-cache 长效防陈旧） -->
<link rel="stylesheet" href="/static/style.css?v=m8r1">
</head>
<body>
<aside id="panel">
  <h1>WNC 台风轨迹工作台</h1>

  <section>
    <h2>导入 CSV</h2>
    <form id="upload-form">
      <select id="upload-kind">
        <option value="forecast">预报轨迹（forecast）</option>
        <option value="observation">观测轨迹（observation）</option>
      </select>
      <input type="file" id="upload-file" accept=".csv,text/csv" required>
      <button type="submit">上传并解析</button>
    </form>
  </section>

  <section>
    <h2>数据集</h2>
    <label for="fc-dataset">预报数据集</label>
    <select id="fc-dataset"></select>
    <label for="obs-dataset">观测叠加（可选）</label>
    <select id="obs-dataset"></select>
  </section>

  <section>
    <h2>筛选与时效</h2>
    <label for="storm">气旋</label>
    <select id="storm"></select>
    <label for="init">起报时次（不混合批次）</label>
    <select id="init"></select>
    <label for="member">集合成员</label>
    <select id="member"></select>
    <label for="lead">预报时效：显示 ≤ <span id="lead-label">全部</span></label>
    <input type="range" id="lead" min="0" max="0" step="1" value="0">
  </section>

  <section>
    <h2>位置概率半径</h2>
    <label for="p-select">覆盖最近 p% 成员（默认 100%）</label>
    <select id="p-select"></select>
    <button id="p-apply" type="button">应用</button>
  </section>

  <section>
    <h2>目标地点</h2>
    <label for="place-select">预存地点</label>
    <select id="place-select"></select>
    <p id="place-warnings" class="muted"></p>
    <label for="target-lat">纬度（-90 – 90，十进制度）</label>
    <input type="text" id="target-lat" inputmode="decimal" placeholder="如 19.05" autocomplete="off">
    <label for="target-lon">经度（-180 – 180，十进制度）</label>
    <input type="text" id="target-lon" inputmode="decimal" placeholder="如 -104.32" autocomplete="off">
    <button id="target-apply" type="button">应用坐标</button>
    <button id="target-pick" type="button" class="secondary">地图点选</button>
    <button id="target-clear" type="button" class="secondary">清除目标</button>
    <div id="target-circle-legend" aria-label="参考圆图例（km，仅视觉参考，不参与判定）"></div>
  </section>

  <section>
    <h2>强度图例（kt，1 分钟平均，按数据提供口径；灰=已消散）</h2>
    <div id="legend"></div>
  </section>

  <p id="status" class="muted">就绪。请先导入或选择预报数据集。</p>
</aside>
<main id="stage">
  <div id="map-wrap"><div id="map"></div></div>
</main>
<aside id="charts">
  <div class="chart-card" id="chart-wrap">
    <div class="chart-body" id="chart"></div>
    <div class="readout" id="chart-readout"></div>
  </div>
  <div class="chart-card hidden" id="pressure-wrap" data-stats-card>
    <div class="chart-body" id="pressure-chart"></div>
    <div class="readout" id="pressure-readout"></div>
  </div>
  <div class="chart-card hidden" id="stack-wrap" data-stats-card>
    <div class="chart-body" id="stack-chart"></div>
    <div class="readout" id="stack-readout"></div>
  </div>
  <!-- M8 终生峰值聚合卡：位于强度等级分布图下方（高度自适应）；每成员明细为最右第四栏（默认隐藏，卡内入口展开） -->
  <div class="chart-card hidden" id="peak-agg-wrap" data-stats-card>
    <div class="impact-body" id="peak-agg-body"></div>
    <div class="hidden" id="peak-agg-foot">
      <button id="peak-toggle" type="button" aria-expanded="false" aria-controls="peaks">每成员明细 ▸</button>
    </div>
  </div>
  <!-- M7c：位置概率半径图表暂隐藏（使用反馈），数据链路与锚点保留，恢复时在 renderStatsCharts 重新启用 -->
  <div class="chart-card hidden" id="radius-wrap" data-stats-card>
    <div class="chart-body" id="radius-chart"></div>
    <div class="readout" id="radius-readout"></div>
  </div>
  <div class="chart-card hidden" id="impact-wrap">
    <div class="impact-body" id="impact-body"></div>
  </div>
</aside>
<!-- M8 终生峰值：每成员明细第四栏（默认隐藏，第三栏聚合卡内「每成员明细」入口展开） -->
<aside id="peaks" aria-label="每成员终生峰值明细（默认隐藏）">
  <div class="peak-head">
    <h2>每成员峰值明细</h2>
    <button id="peak-close" type="button" class="secondary">收起</button>
  </div>
  <div id="peak-body"></div>
</aside>

<script src="/static/vendor/leaflet.js"></script>
<script src="/static/vendor/uPlot.iife.min.js"></script>
<script>window.TILE_CONFIG = {{ tile_config|safe }};</script>
<script>window.STATS_CONFIG = {{ stats_config|safe }};</script>
<!-- M8-R1：?v= 使浏览器内启发式缓存的旧 JS 立即失效（配合 /static no-cache 长效防陈旧） -->
<script type="module" src="/static/app.js?v=m8r1"></script>
</body>
</html>
